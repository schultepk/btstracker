<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BTS Tracker">
<title>BTS Tracker</title>
<style>
  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #232323;
    --surface3: #2c2c2c;
    --accent: #e07b39;
    --accent-dim: rgba(224,123,57,0.15);
    --accent-dim2: rgba(224,123,57,0.08);
    --text: #f0f0f0;
    --text-dim: #999;
    --text-dimmer: #666;
    --border: #333;
    --green: #4caf7d;
    --green-dim: rgba(76,175,125,0.15);
    --blue: #5b9cf6;
    --red: #e05555;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; font-size: 15px; min-height: 100dvh; }

  /* HEADER */
  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 16px 10px; position: sticky; top: 0; z-index: 100; }
  .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .header-title { font-size: 17px; font-weight: 700; color: var(--accent); letter-spacing: 0.3px; }
  .save-indicator { font-size: 11px; color: var(--green); opacity: 0; transition: opacity 0.3s; }
  .save-indicator.show { opacity: 1; }

  /* WEEK SELECTOR */
  .week-scroll { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; padding-bottom: 2px; }
  .week-scroll::-webkit-scrollbar { display: none; }
  .week-btn { flex-shrink: 0; padding: 5px 10px; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--text-dim); font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  .week-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .week-btn.has-data { border-color: var(--accent); color: var(--accent); }
  .week-btn.has-data.active { color: #fff; }

  /* DAY TABS */
  .day-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; background: var(--surface); margin-top: 10px; }
  .day-tabs::-webkit-scrollbar { display: none; }
  .day-tab { flex-shrink: 0; padding: 8px 14px; font-size: 12px; font-weight: 600; color: var(--text-dimmer); border-bottom: 2px solid transparent; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  .day-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .day-tab.has-data { color: var(--text-dim); }
  .day-tab.has-data.active { color: var(--accent); }

  /* WORKOUT HEADER */
  .workout-header { padding: 14px 16px 10px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .workout-title { font-size: 16px; font-weight: 700; color: var(--text); }
  .workout-meta { font-size: 12px; color: var(--text-dim); margin-top: 3px; display: flex; gap: 12px; flex-wrap: wrap; }
  .meta-badge { background: var(--surface3); border-radius: 6px; padding: 2px 7px; font-size: 11px; }
  .block-badge { background: var(--accent-dim); color: var(--accent); border-radius: 6px; padding: 2px 7px; font-size: 11px; font-weight: 600; }
  .workout-date-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .workout-date-input { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 13px; padding: 6px 10px; flex: 1; }
  .workout-date-input:focus { outline: none; border-color: var(--accent); }

  /* EXERCISES */
  .exercises { padding: 10px 12px 80px; }
  .exercise-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px; overflow: hidden; }
  .exercise-header { padding: 12px 14px 10px; cursor: pointer; }
  .exercise-name { font-size: 15px; font-weight: 700; color: var(--text); display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .exercise-name-text { flex: 1; line-height: 1.3; }
  .ex-chevron { color: var(--text-dimmer); font-size: 18px; flex-shrink: 0; transition: transform 0.2s; margin-top: -1px; }
  .exercise-card.expanded .ex-chevron { transform: rotate(180deg); }
  .exercise-specs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .spec-chip { font-size: 11px; background: var(--surface2); border-radius: 5px; padding: 2px 7px; color: var(--text-dim); }
  .spec-chip.technique { background: var(--accent-dim); color: var(--accent); }
  .spec-chip.rpe { background: rgba(91,156,246,0.12); color: var(--blue); }

  /* SET ROWS */
  .exercise-body { display: none; padding: 0 14px 12px; border-top: 1px solid var(--border); }
  .exercise-card.expanded .exercise-body { display: block; }
  .sets-label { font-size: 11px; color: var(--text-dimmer); text-transform: uppercase; letter-spacing: 0.5px; margin: 10px 0 6px; font-weight: 600; }
  .set-row { display: grid; grid-template-columns: 36px 1fr 1fr auto; gap: 6px; align-items: center; margin-bottom: 6px; }
  .set-label { font-size: 12px; color: var(--text-dimmer); font-weight: 600; text-align: center; }
  .set-input { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 15px; padding: 8px 10px; text-align: center; width: 100%; transition: border-color 0.15s; -webkit-appearance: none; }
  .set-input:focus { outline: none; border-color: var(--accent); background: var(--surface3); }
  .set-input::placeholder { color: var(--text-dimmer); font-size: 12px; }
  .set-input.filled { border-color: rgba(224,123,57,0.4); }
  .set-check { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--border); background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; transition: all 0.15s; flex-shrink: 0; }
  .set-check.done { background: var(--green); border-color: var(--green); }
  .col-header { font-size: 10px; color: var(--text-dimmer); text-align: center; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
  .col-headers { display: grid; grid-template-columns: 36px 1fr 1fr auto; gap: 6px; padding: 0; }

  /* NOTES */
  .notes-section { margin-top: 10px; }
  .notes-label { font-size: 11px; color: var(--text-dimmer); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; font-weight: 600; }
  .notes-input { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; padding: 8px 10px; resize: none; font-family: inherit; min-height: 56px; transition: border-color 0.15s; }
  .notes-input:focus { outline: none; border-color: var(--accent); }

  /* COACHING CUE */
  .cue-box { background: var(--accent-dim2); border-left: 3px solid var(--accent); border-radius: 0 6px 6px 0; padding: 8px 10px; margin-top: 8px; font-size: 12px; color: var(--text-dim); line-height: 1.5; }
  .cue-toggle { font-size: 11px; color: var(--accent); cursor: pointer; margin-top: 8px; display: inline-block; }
  .subs-row { margin-top: 8px; font-size: 12px; color: var(--text-dimmer); }
  .subs-row span { color: var(--text-dim); }

  /* COPY BUTTON */
  .copy-btn { width: 100%; padding: 13px; background: var(--accent); border-radius: 12px; border: none; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 6px; transition: opacity 0.15s; }
  .copy-btn:active { opacity: 0.8; }
  .copy-area { padding: 0 12px 12px; }

  /* BOTTOM NAV */
  .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--border); padding: 8px 16px; padding-bottom: max(8px, env(safe-area-inset-bottom)); z-index: 100; }
  .bottom-actions { display: flex; gap: 8px; }
  .btn-secondary { flex: 1; padding: 10px; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; color: var(--text-dim); font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn-primary { flex: 2; padding: 10px; background: var(--accent); border: none; border-radius: 10px; color: #fff; font-size: 13px; font-weight: 700; cursor: pointer; }

  /* PROGRESS VIEW */
  .progress-container { padding: 12px; }
  .prog-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; color: var(--accent); }
  .prog-table-wrap { overflow-x: auto; }
  .prog-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .prog-table th { background: var(--surface2); color: var(--text-dim); padding: 7px 8px; text-align: left; font-weight: 600; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .prog-table td { padding: 7px 8px; border-bottom: 1px solid rgba(51,51,51,0.5); vertical-align: top; }
  .prog-table tr:hover td { background: var(--surface2); }
  .prog-ex-name { font-weight: 600; color: var(--text); }
  .prog-entry { font-size: 11px; color: var(--text-dim); white-space: nowrap; }
  .prog-week-badge { font-size: 10px; background: var(--surface3); border-radius: 4px; padding: 1px 5px; color: var(--text-dimmer); }

  /* MODAL */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; align-items: flex-end; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border-radius: 18px 18px 0 0; padding: 20px 16px; max-height: 80vh; overflow-y: auto; width: 100%; }
  .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; }
  .modal-close { float: right; font-size: 24px; color: var(--text-dimmer); cursor: pointer; margin-top: -4px; }
  .modal-body { font-size: 13px; line-height: 1.6; color: var(--text-dim); }
  .modal-pre { background: var(--surface2); border-radius: 8px; padding: 12px; font-size: 12px; font-family: 'SF Mono', monospace; white-space: pre-wrap; color: var(--text); margin-top: 10px; max-height: 300px; overflow-y: auto; }
  .modal-copy-btn { width: 100%; padding: 12px; background: var(--accent); border: none; border-radius: 10px; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 10px; }

  /* EMPTY STATE */
  .empty-state { text-align: center; padding: 40px 20px; color: var(--text-dimmer); }
  .empty-state-icon { font-size: 48px; margin-bottom: 12px; }

  /* SECTION DIVIDER */
  .section-divider { font-size: 11px; color: var(--text-dimmer); text-transform: uppercase; letter-spacing: 0.8px; padding: 8px 0 4px; font-weight: 700; }

  /* PREVIOUS WEEK HISTORY */
  .prev-history { background: var(--surface2); border-radius: 8px; padding: 8px 10px; margin-top: 10px; }
  .prev-history-title { font-size: 10px; color: var(--text-dimmer); text-transform: uppercase; letter-spacing: 0.6px; font-weight: 700; margin-bottom: 6px; }
  .prev-history-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 3px; }
  .prev-history-week { font-size: 10px; font-weight: 700; color: var(--text-dimmer); min-width: 28px; }
  .prev-history-sets { font-size: 13px; font-weight: 600; color: var(--text); letter-spacing: 0.2px; }
  .prev-history-note { font-size: 10px; color: var(--text-dimmer); font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 140px; }
  .prev-history-empty { font-size: 12px; color: var(--text-dimmer); font-style: italic; }

  /* SUBSTITUTION SWAP */
  .sub-swap-bar { display: flex; align-items: center; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .sub-swap-label { font-size: 11px; color: var(--text-dimmer); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; }
  .sub-btn { padding: 5px 10px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface2); color: var(--text-dim); font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: all 0.15s; }
  .sub-btn:active { opacity: 0.7; }
  .sub-btn.selected { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
  .sub-btn.swapped { border-color: var(--accent); background: var(--accent); color: #fff; }
  .swap-confirm-btn { padding: 5px 12px; border-radius: 20px; border: none; background: var(--accent); color: #fff; font-size: 12px; font-weight: 700; cursor: pointer; }
  .swap-reset-btn { padding: 5px 10px; border-radius: 20px; border: 1px solid var(--red); background: transparent; color: var(--red); font-size: 12px; font-weight: 600; cursor: pointer; }
  .swapped-indicator { font-size: 10px; background: var(--accent-dim); color: var(--accent); border-radius: 5px; padding: 2px 6px; font-weight: 700; }
  .exercise-card.swapped-card { border-color: rgba(224,123,57,0.4); }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="header-title">🏋️ BTS Tracker</div>
    <div class="save-indicator" id="saveIndicator">✓ Saved</div>
  </div>
  <div class="week-scroll" id="weekScroll"></div>
  <div class="day-tabs" id="dayTabs"></div>
</div>

<div id="mainContent"></div>

<div class="bottom-bar">
  <div class="bottom-actions">
    <button class="btn-secondary" onclick="showProgress()">📊 Progress</button>
    <button class="btn-secondary" onclick="showCopyModal()">📋 Copy Log</button>
    <button class="btn-primary" onclick="clearWorkout()">🗑 Clear Day</button>
  </div>
</div>

<!-- Progress Modal -->
<div class="modal-overlay" id="progressModal">
  <div class="modal">
    <div class="modal-title">📊 Progress <span class="modal-close" onclick="closeModal('progressModal')">×</span></div>
    <div id="progressContent"></div>
  </div>
</div>

<!-- Copy Modal -->
<div class="modal-overlay" id="copyModal">
  <div class="modal">
    <div class="modal-title">📋 Copy to Notes <span class="modal-close" onclick="closeModal('copyModal')">×</span></div>
    <div id="copyContent"></div>
  </div>
</div>

<!-- Swap exercise modal -->
<div class="modal-overlay" id="swapModal">
  <div class="modal">
    <div class="modal-title">Swap Exercise <span class="modal-close" onclick="closeModal('swapModal')">×</span></div>
    <div id="swapContent"></div>
  </div>
</div>

<!-- Clear confirm modal -->
<div class="modal-overlay" id="clearModal">
  <div class="modal">
    <div class="modal-title">Clear Workout? <span class="modal-close" onclick="closeModal('clearModal')">×</span></div>
    <div class="modal-body">This will delete all logged sets and notes for the current day. Are you sure?</div>
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="btn-secondary" onclick="closeModal('clearModal')" style="flex:1">Cancel</button>
      <button class="btn-primary" onclick="confirmClear()" style="flex:1;background:var(--red);border:none">Clear</button>
    </div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// PROGRAM DATA
// ─────────────────────────────────────────────────────────────────────────────
const DAYS = ['Upper','Lower','Pull','Push','Legs'];
const DAY_LABELS = {
  Upper: 'Upper (Strength)',
  Lower: 'Lower (Strength)',
  Pull: 'Pull (Hypertrophy)',
  Push: 'Push (Hypertrophy)',
  Legs: 'Legs (Hypertrophy)'
};

// Block info
const BLOCKS = {
  1: 'Foundation Block', 2: 'Foundation Block', 3: 'Foundation Block', 4: 'Foundation Block', 5: 'Foundation Block',
  6: 'Ramping Block', 7: 'Ramping Block', 8: 'Ramping Block', 9: 'Ramping Block', 10: 'Ramping Block',
  11: 'Peak Block', 12: 'Peak Block'
};

// Exercise definitions by block (exercises change between blocks)
const EXERCISES = {
  // ─── BLOCK 1 (Weeks 1-5) ───────────────────────────────────────────────
  'b1_Upper': [
    { name: '45° Incline Barbell Press', reps: '6-8', rest: '3-5 min', sub1: '45° Incline DB Press', sub2: '45° Incline Machine Press', cue: '1 second pause at the bottom of each rep while maintaining tension on the pecs' },
    { name: 'Cable Crossover Ladder', reps: '8-10', rest: '1-2 min', sub1: 'Pec Deck', sub2: 'Bottom-Half DB Flye', cue: 'Do one set with low cable position, one set with medium-height cable position, and one with high cable. Choose your preferred positions if only 1-2 sets.' },
    { name: 'Wide-Grip Pull-Up', reps: '8-10', rest: '2-3 min', sub1: 'Wide-Grip Lat Pulldown', sub2: 'Dual-Handle Lat Pulldown', cue: '1.5x shoulder width overhand grip. Slow 2-3 second negative. Feel your lats pulling apart on the way down.' },
    { name: 'High-Cable Lateral Raise', reps: '8-10', rest: '1-2 min', sub1: 'High-Cable Cuffed Lateral Raise', sub2: 'Lean-In DB Lateral Raise', cue: 'Focus on squeezing your lateral delt to move the weight.' },
    { name: 'Pendlay Deficit Row', reps: '6-8', rest: '2-3 min', sub1: 'Smith Machine Row', sub2: 'Single-Arm DB Row', cue: 'Stand on a bumper plate. Focus on getting a big stretch and touch your stomach/chest on each rep!' },
    { name: 'Overhead Cable Triceps Extension (Bar)', reps: '8-10', rest: '1-2 min', sub1: 'Overhead Cable Triceps Extension (Rope)', sub2: 'DB Skull Crusher', cue: 'Optionally pause for 0.5-1 second in the stretched aspect of each rep' },
    { name: 'Bayesian Cable Curl', reps: '8-10', rest: '1-2 min', sub1: 'Seated Super-Bayesian High Cable Curl', sub2: 'Incline DB Stretch Curl', cue: 'If you have a left-right bicep size imbalance, do these 1 arm at a time starting with the weaker arm.' },
  ],
  'b1_Lower': [
    { name: 'Lying Leg Curl', reps: '8-10', rest: '1-2 min', sub1: 'Seated Leg Curl', sub2: 'Nordic Ham Curl', cue: 'Set the machine so that you get the biggest stretch possible at the bottom. Prevent your butt from popping up as you curl.' },
    { name: 'Smith Machine Squat', reps: '6-8', rest: '3-5 min', sub1: 'DB Bulgarian Split Squat', sub2: 'High-Bar Back Squat', cue: 'Once under the bar, set up your feet as you would a normal squat and then bring them forward ~3-6 inches. This will cause you to lean back into the bar slightly, allowing for a more upright squat while also placing more tension on the quads.' },
    { name: 'Barbell RDL', reps: '6-8', rest: '2-3 min', sub1: 'DB RDL', sub2: 'Snatch-Grip RDL', cue: 'To keep tension on the hamstrings, stop about 75% of the way to full lockout on each rep (i.e. stay in the bottom 3/4 of the range of motion).' },
    { name: 'Leg Extension', reps: '8-10', rest: '1-2 min', sub1: 'Reverse Nordic', sub2: 'Sissy Squat', cue: 'Set the seat back as far as it will go while still feeling comfortable. Grab the handles as hard as you can to pull your butt down into the seat. Use a 2-3 second negative.' },
    { name: 'Standing Calf Raise', reps: '6-8', rest: '1-2 min', sub1: 'Seated Calf Raise', sub2: 'Leg Press Calf Press', cue: '1-2 second pause at the bottom of each rep. Instead of just going up onto your toes, think about rolling your ankle back and forth on the balls of your feet.' },
    { name: 'Cable Crunch', reps: '8-10', rest: '1-2 min', sub1: 'Decline Weighted Crunch', sub2: 'Machine Crunch', cue: 'Round your lower back as you crunch. Maintain a mind-muscle connection with your 6-pack.' },
  ],
  'b1_Pull': [
    { name: 'Neutral-Grip Lat Pulldown', reps: '8-10', rest: '2-3 min', sub1: 'Neutral-Grip Pull-Up', sub2: 'Dual-Handle Lat Pulldown', cue: 'Do these pulldowns with the handle more out in front of you, more like a cross between pullover and a pulldown. Focus on feeling your lats working more than the weight you\'re using.' },
    { name: 'Chest-Supported Machine Row', reps: '8-10', rest: '2-3 min', sub1: 'Chest-Supported T-Bar Row', sub2: 'Incline Chest-Supported DB Row', cue: 'Flare elbows out at roughly 45° and squeeze your shoulder blades together hard at the top of each rep.' },
    { name: 'Neutral-Grip Seated Cable Row', reps: '10-12', rest: '2-3 min', sub1: 'Helms Row', sub2: 'Meadows Row', cue: 'Focus on squeezing your shoulder blades together, driving your elbows down and back.' },
    { name: '1-Arm 45° Cable Rear Delt Flye', reps: '10-12', rest: '1-2 min', sub1: 'Rope Face Pull', sub2: 'Reverse Pec Deck', cue: 'Pause for 1-2 seconds in the squeeze of each rep. Contract the rear delts hard!' },
    { name: 'Machine Shrug', reps: '10-12', rest: '1-2 min', sub1: 'Cable Paused Shrug-In', sub2: 'DB Shrug', cue: 'Brief pause at the top of the bottom of ROM. Think about pulling your shoulders up to your ears!' },
    { name: 'EZ-Bar Cable Curl', reps: '10-12', rest: '1-2 min', sub1: 'EZ-Bar Curl', sub2: 'DB Curl', cue: 'Set up the cable at the lowest position. Maintain constant tension on the biceps. Slow, controlled reps!' },
    { name: 'Machine Preacher Curl', reps: '12-15', rest: '1-2 min', sub1: 'EZ-Bar Preacher Curl', sub2: 'DB Preacher Curl', cue: 'Smooth, controlled reps. Mind-muscle connection with the biceps.' },
  ],
  'b1_Push': [
    { name: 'Barbell Bench Press', reps: '8-10', rest: '3-5 min', sub1: 'Machine Chest Press', sub2: 'DB Bench Press', cue: 'Set up a comfortable arch, quick pause on the chest and explode up on each rep.' },
    { name: 'Machine Shoulder Press', reps: '8-10', rest: '2-3 min', sub1: 'Cable Shoulder Press', sub2: 'Seated DB Shoulder Press', cue: 'Ensure that your elbows break at least 90°. Mind-muscle connection with your delts. Smooth, controlled reps.' },
    { name: 'Bottom-Half DB Flye', reps: '10-12', rest: '1-2 min', sub1: 'Bottom-Half Seated Cable Flye', sub2: 'Low-to-High Cable Crossover', cue: 'All reps and sets are to be performed in the bottom half of the ROM. Focus on feeling a deep stretch in your pecs at the bottom of each rep.' },
    { name: 'High-Cable Lateral Raise', reps: '10-12', rest: '1-2 min', sub1: 'High-Cable Cuffed Lateral Raise', sub2: 'Lean-In DB Lateral Raise', cue: 'Focus on squeezing your lateral delt to move the weight.' },
    { name: 'Overhead Cable Triceps Extension (Bar)', reps: '10-12', rest: '1-2 min', sub1: 'Overhead Cable Triceps Extension (Rope)', sub2: 'DB Skull Crusher', cue: 'Optionally pause for 0.5-1 second in the stretched aspect of each rep' },
    { name: 'Cable Triceps Kickback', reps: '12-15', rest: '1-2 min', sub1: 'DB Triceps Kickback', sub2: 'Bench Dip', cue: 'There are two ways you can do this: upright or bent over. Choose the one that feels more comfortable. The main thing is that when you\'re in the full squeeze, your shoulder should be positioned back behind your torso.' },
    { name: 'Roman Chair Leg Raise', reps: '10-20', rest: '1-2 min', sub1: 'Hanging Leg Raise', sub2: 'Modified Candlestick', cue: 'Allow your lower back to round as you curl your legs up. 10-20 reps is a broad range on purpose: just go until you hit the listed RPE with controlled form.' },
  ],

// ─────────────────────────────────────────────────────────────────────────────
// STATE & STORAGE
// ─────────────────────────────────────────────────────────────────────────────
let state = {
  currentWeek: 1,
  currentDay: 'Upper',
  expandedExercises: {},
  showCues: {},
  swaps: {}   // key: "week_day_ei" → { name, sub1, sub2, reps, rest, cue } or null
};

// Load swaps from localStorage on init
(function loadSwaps() {
  try {
    const raw = localStorage.getItem('bts_swaps');
    if (raw) state.swaps = JSON.parse(raw);
  } catch {}
})();

function saveSwaps() {
  try { localStorage.setItem('bts_swaps', JSON.stringify(state.swaps)); } catch {}
}

function swapKey(week, day, ei) { return `${week}_${day}_${ei}`; }

function getEffectiveExercise(week, day, ei) {
  const base = getExercises(week, day)[ei];
  const swap = state.swaps[swapKey(week, day, ei)];
  if (swap) return { ...base, ...swap, _swapped: true, _swapName: swap.name };
  return base;
}

// Get previous weeks' logged data for an exercise slot
function getPrevHistory(week, day, ei) {
  const results = [];
  // Look back up to 4 weeks
  for (let w = week - 1; w >= Math.max(1, week - 4); w--) {
    const saved = loadWorkout(w, day);
    if (!saved) continue;
    const exSets = saved.sets?.[ei] || {};
    const hasAny = Object.values(exSets).some(s => s?.weight || s?.reps);
    if (!hasAny) continue;
    const setStrs = [];
    for (let s = 0; s < 4; s++) {
      const sv = exSets[s];
      if (sv?.weight || sv?.reps) setStrs.push(`${sv.weight||'—'}×${sv.reps||'—'}`);
    }
    const note = saved.notes?.[ei] || '';
    // Also show which exercise was used (may differ across blocks)
    const prevEx = getEffectiveExercise(w, day, ei);
    results.push({ week: w, sets: setStrs, note, exName: prevEx?.name || '' });
  }
  return results;
}

function getBlockKey(week) {
  if (week <= 5) return 'b1';
  if (week <= 10) return 'b2';
  return 'b3';
}

function getExercises(week, day) {
  const block = getBlockKey(week);
  return EXERCISES[`${block}_${day}`] || [];
}

function getWeekConfig(week, day) {
  return WEEK_CONFIG[week]?.[day] || [];
}

function storageKey(week, day) {
  return `bts_w${week}_${day}`;
}

function loadWorkout(week, day) {
  try {
    const raw = localStorage.getItem(storageKey(week, day));
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}

function saveWorkout(week, day, data) {
  try {
    localStorage.setItem(storageKey(week, day), JSON.stringify(data));
    showSaved();
  } catch(e) { console.error('Save failed', e); }
}

function hasData(week, day) {
  const data = loadWorkout(week, day);
  if (!data) return false;
  return Object.values(data.sets || {}).some(s => s && Object.values(s).some(v => v));
}

function showSaved() {
  const el = document.getElementById('saveIndicator');
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2000);
}

// ─────────────────────────────────────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────────────────────────────────────
function render() {
  renderWeekTabs();
  renderDayTabs();
  renderWorkout();
}

function renderWeekTabs() {
  const cont = document.getElementById('weekScroll');
  cont.innerHTML = '';
  for (let w = 1; w <= 12; w++) {
    const btn = document.createElement('button');
    btn.className = 'week-btn';
    btn.textContent = `Wk ${w}`;
    if (w === state.currentWeek) btn.classList.add('active');
    const anyData = DAYS.some(d => hasData(w, d));
    if (anyData) btn.classList.add('has-data');
    btn.onclick = () => { state.currentWeek = w; render(); };
    cont.appendChild(btn);
  }
  // Scroll active into view
  setTimeout(() => {
    const active = cont.querySelector('.active');
    if (active) active.scrollIntoView({ inline: 'center', behavior: 'smooth' });
  }, 50);
}

function renderDayTabs() {
  const cont = document.getElementById('dayTabs');
  cont.innerHTML = '';
  DAYS.forEach(day => {
    const tab = document.createElement('div');
    tab.className = 'day-tab';
    tab.textContent = day;
    if (day === state.currentDay) tab.classList.add('active');
    if (hasData(state.currentWeek, day)) tab.classList.add('has-data');
    tab.onclick = () => { state.currentDay = day; renderWorkout(); renderDayTabs(); };
    cont.appendChild(tab);
  });
}

function renderWorkout() {
  const week = state.currentWeek;
  const day = state.currentDay;
  const exercises = getExercises(week, day);
  const configs = getWeekConfig(week, day);
  const saved = loadWorkout(week, day) || {};
  const sets = saved.sets || {};
  const notes = saved.notes || {};
  const date = saved.date || '';
  const block = BLOCKS[week];

  let html = `
    <div class="workout-header">
      <div class="workout-title">Week ${week} — ${DAY_LABELS[day]}</div>
      <div class="workout-meta">
        <span class="block-badge">${block}</span>
        <span class="meta-badge">5 days/wk</span>
      </div>
      <div class="workout-date-row">
        <input class="workout-date-input" type="date" id="workoutDate" value="${date}" placeholder="Date" onchange="onDateChange(this.value)">
      </div>
    </div>
    <div class="exercises">`;

  exercises.forEach((ex, ei) => {
    const cfg = configs[ei] || { workingSets: 2, technique: 'N/A', earlyRPE: '~7-8', lastRPE: '~8-9' };
    const numSets = cfg.workingSets;
    const expanded = state.expandedExercises[`${week}_${day}_${ei}`];
    const exSets = sets[ei] || {};
    const exNote = notes[ei] || '';
    const hasFill = Object.values(exSets).some(s => s?.weight || s?.reps);
    const showCue = state.showCues[`${week}_${day}_${ei}`];

    // Use effective exercise (respects swaps)
    const effEx = getEffectiveExercise(week, day, ei);
    const isSwapped = !!effEx._swapped;

    // Previous history (always from base exercise slot ei)
    const history = getPrevHistory(week, day, ei);

    html += `<div class="exercise-card${expanded ? ' expanded' : ''}${isSwapped ? ' swapped-card' : ''}" id="ex_${ei}">
      <div class="exercise-header" onclick="toggleEx(${ei})">
        <div class="exercise-name">
          <span class="exercise-name-text">${effEx.name}${isSwapped ? ' <span class="swapped-indicator">SWAP</span>' : ''}</span>
          <span class="ex-chevron">⌄</span>
        </div>
        <div class="exercise-specs">
          <span class="spec-chip">${effEx.reps} reps</span>
          <span class="spec-chip">${numSets} sets</span>
          ${cfg.technique !== 'N/A' ? `<span class="spec-chip technique">${cfg.technique}</span>` : ''}
          <span class="spec-chip rpe">RPE ${cfg.lastRPE}</span>
          <span class="spec-chip">${effEx.rest}</span>
          ${hasFill ? '<span class="spec-chip" style="background:var(--green-dim);color:var(--green)">✓ Logged</span>' : ''}
        </div>
      </div>
      <div class="exercise-body">`;

    // ── PREVIOUS HISTORY ──
    html += `<div class="prev-history">
        <div class="prev-history-title">📈 Previous Weeks</div>`;
    if (history.length === 0) {
      html += `<div class="prev-history-empty">No data logged yet</div>`;
    } else {
      history.forEach(h => {
        const diffName = h.exName && h.exName !== ex.name ? ` <span style="font-size:10px;color:var(--text-dimmer)">(${h.exName})</span>` : '';
        html += `<div class="prev-history-row">
          <span class="prev-history-week">W${h.week}</span>
          <span class="prev-history-sets">${h.sets.join('  ')}</span>
          ${h.note ? `<span class="prev-history-note">${h.note}</span>` : ''}
          ${diffName}
        </div>`;
      });
    }
    html += `</div>`;

    // ── SETS ──
    html += `<div class="col-headers" style="margin-top:10px">
          <div class="col-header">Set</div>
          <div class="col-header">Weight</div>
          <div class="col-header">Reps</div>
          <div class="col-header"></div>
        </div>`;

    for (let s = 0; s < numSets; s++) {
      const sv = exSets[s] || {};
      const isDone = sv.done || false;
      html += `<div class="set-row">
        <div class="set-label">${s + 1}</div>
        <input class="set-input${sv.weight ? ' filled' : ''}" type="number" inputmode="decimal" placeholder="lbs/kg" value="${sv.weight || ''}" 
          onchange="onSetChange(${ei},${s},'weight',this.value)" oninput="onSetChange(${ei},${s},'weight',this.value)">
        <input class="set-input${sv.reps ? ' filled' : ''}" type="number" inputmode="numeric" placeholder="reps" value="${sv.reps || ''}" 
          onchange="onSetChange(${ei},${s},'reps',this.value)" oninput="onSetChange(${ei},${s},'reps',this.value)">
        <button class="set-check${isDone ? ' done' : ''}" onclick="toggleDone(${ei},${s})">${isDone ? '✓' : ''}</button>
      </div>`;
    }

    // ── NOTES ──
    html += `<div class="notes-section">
        <div class="notes-label">Notes</div>
        <textarea class="notes-input" placeholder="e.g. RPE felt like 9, good pump..." 
          onchange="onNoteChange(${ei},this.value)" oninput="onNoteChange(${ei},this.value)">${exNote}</textarea>
      </div>`;

    // ── COACHING CUE ──
    html += `<span class="cue-toggle" onclick="toggleCue(${ei})">${showCue ? '▲ Hide cue' : '▼ Show coaching cue'}</span>`;
    if (showCue) {
      html += `<div class="cue-box">${effEx.cue}</div>`;
    }

    // ── SUBSTITUTION SWAP BAR ──
    html += `<div class="sub-swap-bar">
        <span class="sub-swap-label">Swap:</span>`;
    if (isSwapped) {
      html += `<span style="font-size:12px;color:var(--text-dim);flex:1">Using: <strong style="color:var(--text)">${effEx.name}</strong></span>
        <button class="swap-reset-btn" onclick="resetSwap(${ei})">↩ Reset</button>`;
    } else {
      html += `<button class="sub-btn" onclick="openSwapModal(${ei},0)">${ex.sub1}</button>
        <button class="sub-btn" onclick="openSwapModal(${ei},1)">${ex.sub2}</button>`;
    }
    html += `</div>`;

    html += `</div></div>`;
  });

  html += `</div>`;
  document.getElementById('mainContent').innerHTML = html;
}

// ─────────────────────────────────────────────────────────────────────────────
// EVENT HANDLERS
// ─────────────────────────────────────────────────────────────────────────────
function toggleEx(ei) {
  const key = `${state.currentWeek}_${state.currentDay}_${ei}`;
  state.expandedExercises[key] = !state.expandedExercises[key];
  const card = document.getElementById(`ex_${ei}`);
  card.classList.toggle('expanded', state.expandedExercises[key]);
}

function toggleCue(ei) {
  const key = `${state.currentWeek}_${state.currentDay}_${ei}`;
  state.showCues[key] = !state.showCues[key];
  renderWorkout();
}

function openSwapModal(ei, subIndex) {
  const week = state.currentWeek;
  const day = state.currentDay;
  const base = getExercises(week, day)[ei];
  if (!base) return;

  const subName = subIndex === 0 ? base.sub1 : base.sub2;
  const otherName = subIndex === 0 ? base.sub2 : base.sub1;

  // Get history for this substitute across all previous weeks (same slot)
  const history = [];
  for (let w = week - 1; w >= Math.max(1, week - 6); w--) {
    const saved = loadWorkout(w, day);
    if (!saved) continue;
    const exSets = saved.sets?.[ei] || {};
    const prevSwap = state.swaps[swapKey(w, day, ei)];
    const prevName = prevSwap ? prevSwap.name : base.name;
    if (prevName !== subName) continue; // only show history when this sub was used
    const hasAny = Object.values(exSets).some(s => s?.weight || s?.reps);
    if (!hasAny) continue;
    const setStrs = [];
    for (let s = 0; s < 4; s++) {
      const sv = exSets[s];
      if (sv?.weight || sv?.reps) setStrs.push(`${sv.weight||'—'}×${sv.reps||'—'}`);
    }
    history.push({ week: w, sets: setStrs });
  }

  const cont = document.getElementById('swapContent');
  let histHtml = '';
  if (history.length > 0) {
    histHtml = `<div class="prev-history" style="margin-bottom:12px">
      <div class="prev-history-title">📈 Previous times using this sub</div>
      ${history.map(h => `<div class="prev-history-row"><span class="prev-history-week">W${h.week}</span><span class="prev-history-sets">${h.sets.join('  ')}</span></div>`).join('')}
    </div>`;
  }

  cont.innerHTML = `
    <div style="margin-bottom:12px;font-size:13px;color:var(--text-dim)">
      Replacing: <strong style="color:var(--text)">${base.name}</strong>
    </div>
    ${histHtml}
    <div style="margin-bottom:12px">
      <div style="font-size:12px;color:var(--text-dimmer);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px;font-weight:700">Swap to</div>
      <div style="background:var(--accent-dim);border:1px solid var(--accent);border-radius:10px;padding:12px">
        <div style="font-size:15px;font-weight:700;color:var(--text);margin-bottom:4px">${subName}</div>
        <div style="font-size:12px;color:var(--text-dim)">${subIndex === 0 ? 'Option 1' : 'Option 2'}</div>
      </div>
    </div>
    <div style="margin-bottom:12px">
      <div style="font-size:12px;color:var(--text-dimmer);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px;font-weight:700">Or swap to</div>
      <div style="background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px;cursor:pointer" onclick="confirmSwap(${ei},${subIndex===0?1:0})">
        <div style="font-size:15px;font-weight:700;color:var(--text-dim);margin-bottom:4px">${otherName}</div>
        <div style="font-size:12px;color:var(--text-dimmer)">${subIndex === 0 ? 'Option 2' : 'Option 1'}</div>
      </div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn-secondary" onclick="closeModal('swapModal')" style="flex:1">Cancel</button>
      <button class="btn-primary" onclick="confirmSwap(${ei},${subIndex})" style="flex:2">Use ${subName}</button>
    </div>`;

  openModal('swapModal');
}

function confirmSwap(ei, subIndex) {
  const week = state.currentWeek;
  const day = state.currentDay;
  const base = getExercises(week, day)[ei];
  if (!base) return;
  const subName = subIndex === 0 ? base.sub1 : base.sub2;
  // Store just the name override; keep reps/rest/cue from base
  state.swaps[swapKey(week, day, ei)] = { name: subName };
  saveSwaps();
  closeModal('swapModal');
  renderWorkout();
}

function resetSwap(ei) {
  const week = state.currentWeek;
  const day = state.currentDay;
  delete state.swaps[swapKey(week, day, ei)];
  saveSwaps();
  renderWorkout();
}

function getCurrentData() {
  return loadWorkout(state.currentWeek, state.currentDay) || { sets: {}, notes: {}, date: '' };
}

function onSetChange(ei, si, field, val) {
  const data = getCurrentData();
  if (!data.sets[ei]) data.sets[ei] = {};
  if (!data.sets[ei][si]) data.sets[ei][si] = {};
  data.sets[ei][si][field] = val;
  saveWorkout(state.currentWeek, state.currentDay, data);
  // Update filled class
  const inputs = document.querySelectorAll('.set-input');
  inputs.forEach(inp => {
    if (inp.value) inp.classList.add('filled');
    else inp.classList.remove('filled');
  });
  renderDayTabs();
  renderWeekTabs();
}

function toggleDone(ei, si) {
  const data = getCurrentData();
  if (!data.sets[ei]) data.sets[ei] = {};
  if (!data.sets[ei][si]) data.sets[ei][si] = {};
  data.sets[ei][si].done = !data.sets[ei][si].done;
  saveWorkout(state.currentWeek, state.currentDay, data);
  renderWorkout();
}

function onNoteChange(ei, val) {
  const data = getCurrentData();
  if (!data.notes) data.notes = {};
  data.notes[ei] = val;
  saveWorkout(state.currentWeek, state.currentDay, data);
}

function onDateChange(val) {
  const data = getCurrentData();
  data.date = val;
  saveWorkout(state.currentWeek, state.currentDay, data);
}

// ─────────────────────────────────────────────────────────────────────────────
// COPY LOG
// ─────────────────────────────────────────────────────────────────────────────
function buildLogText(week, day) {
  const exercises = getExercises(week, day);
  const saved = loadWorkout(week, day);
  if (!saved) return null;
  const sets = saved.sets || {};
  const notes = saved.notes || {};
  const date = saved.date ? new Date(saved.date + 'T12:00:00').toLocaleDateString('en-US', { weekday:'long', year:'numeric', month:'long', day:'numeric' }) : 'Date not set';

  let lines = [`📅 ${date}`, `📋 Week ${week} — ${DAY_LABELS[day]} (${BLOCKS[week]})`, ''];

  exercises.forEach((ex, ei) => {
    const exSets = sets[ei] || {};
    const hasAny = Object.values(exSets).some(s => s?.weight || s?.reps);
    if (!hasAny) return;
    let setStr = [];
    const numSets = Object.keys(exSets).length;
    for (let s = 0; s < Math.max(numSets, 1); s++) {
      const sv = exSets[s];
      if (!sv) continue;
      const w = sv.weight || '?';
      const r = sv.reps || '?';
      if (sv.weight || sv.reps) setStr.push(`${w}x${r}`);
    }
    const effEx = getEffectiveExercise(week, day, ei);
    const swapNote = effEx._swapped ? ` [sub for ${ex.name}]` : '';
    let line = `• ${effEx.name}${swapNote}: ${setStr.join(', ')}`;
    if (notes[ei]) line += `\n  → ${notes[ei]}`;
    lines.push(line);
  });

  return lines.join('\n');
}

function showCopyModal() {
  const text = buildLogText(state.currentWeek, state.currentDay);
  const cont = document.getElementById('copyContent');
  if (!text) {
    cont.innerHTML = '<div class="modal-body">No data logged for this workout yet.</div>';
  } else {
    cont.innerHTML = `
      <div class="modal-body">Copy this to paste into Apple Notes:</div>
      <div class="modal-pre" id="logText">${text}</div>
      <button class="modal-copy-btn" onclick="copyText()">📋 Copy to Clipboard</button>`;
  }
  openModal('copyModal');
}

function copyText() {
  const el = document.getElementById('logText');
  if (!el) return;
  const text = el.textContent;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => {
      el.style.background = 'var(--green-dim)';
      setTimeout(() => { el.style.background = ''; }, 1000);
    });
  } else {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// PROGRESS VIEW
// ─────────────────────────────────────────────────────────────────────────────
function showProgress() {
  const day = state.currentDay;
  const exercises = getExercises(1, day); // use block 1 names as reference
  const cont = document.getElementById('progressContent');

  let html = `<div style="margin-bottom:8px;font-size:13px;color:var(--text-dim)">Showing progress for <strong style="color:var(--text)">${DAY_LABELS[day]}</strong> across all weeks.</div>`;

  exercises.forEach((ex, ei) => {
    let rows = '';
    for (let w = 1; w <= 12; w++) {
      const blockEx = getExercises(w, day);
      const thisEx = blockEx[ei];
      if (!thisEx) continue;
      const saved = loadWorkout(w, day);
      if (!saved) continue;
      const exSets = saved.sets?.[ei] || {};
      const hasData2 = Object.values(exSets).some(s => s?.weight || s?.reps);
      if (!hasData2) continue;
      const setStrs = [];
      for (let s = 0; s < 4; s++) {
        const sv = exSets[s];
        if (sv?.weight || sv?.reps) setStrs.push(`${sv.weight||'?'}×${sv.reps||'?'}`);
      }
      const dateStr = saved.date ? new Date(saved.date + 'T12:00:00').toLocaleDateString('en-US', { month:'short', day:'numeric' }) : '';
      rows += `<tr>
        <td><span class="prog-week-badge">W${w}</span></td>
        <td><span class="prog-entry">${setStrs.join(' / ')}</span></td>
        <td><span class="prog-entry">${dateStr}</span></td>
      </tr>`;
    }
    if (rows) {
      html += `<div style="margin-bottom:16px">
        <div class="prog-ex-name" style="font-size:13px;font-weight:700;margin-bottom:6px;color:var(--accent)">${ex.name}</div>
        <div class="prog-table-wrap"><table class="prog-table">
          <tr><th>Week</th><th>Sets (w×r)</th><th>Date</th></tr>
          ${rows}
        </table></div>
      </div>`;
    }
  });

  if (!html.includes('<table')) {
    html += '<div class="empty-state"><div class="empty-state-icon">📊</div><div>No data logged for this day yet.</div></div>';
  }

  cont.innerHTML = html;
  openModal('progressModal');
}

// ─────────────────────────────────────────────────────────────────────────────
// CLEAR

function clearWorkout() {
  openModal('clearModal');
}

function confirmClear() {
  localStorage.removeItem(storageKey(state.currentWeek, state.currentDay));
  closeModal('clearModal');
  renderDayTabs();
  renderWeekTabs();
  renderWorkout();
}

// ─────────────────────────────────────────────────────────────────────────────
// MODAL
// ─────────────────────────────────────────────────────────────────────────────
function openModal(id) {
  document.getElementById(id).classList.add('open');
}
function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}
// Close on overlay click
document.querySelectorAll('.modal-overlay').forEach(el => {
  el.addEventListener('click', e => {
    if (e.target === el) el.classList.remove('open');
  });
});
